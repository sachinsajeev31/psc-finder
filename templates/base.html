<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}PSC Finder{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header>
        <nav class="navbar">

            <div class="logo">
                PSC <span>FINDER</span>
            </div>

            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/posts">Find Posts</a>
                <a href="/syllabus">Syllabus</a>
                <a href="/exams">Exams</a>
                <a href="/mock-tests">Mock Tests</a>
            </div>

        </nav>
    </header>


    <main>
        {% block content %}
        {% endblock %}
    </main>


    <footer>
        <p>PSC Finder — Kerala PSC Preparation Platform</p>
        <p class="disclaimer">
            Independent preparation platform. Always verify information
            with the official Kerala PSC notification.
        </p>
    </footer>

</body>
</html>
